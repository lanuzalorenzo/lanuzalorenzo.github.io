<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Lorenzo Lanuza — Software Architect · .NET &amp; Azure · DevSecOps &amp; Cloud Security</title>
  <desc id="cover-desc">Portada de LinkedIn: nombre, rol y dominio sobre fondo azul oscuro. A la derecha, tres parábolas rotuladas 01 Architecture, 02 DevSecOps y 03 Cloud Security.</desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#51b8ff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#51b8ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#51b8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#edf5fb" opacity="0.10"/>
    </pattern>
    <linearGradient id="grid-fade" x1="1060" y1="0" x2="1320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#081725" stop-opacity="1"/>
      <stop offset="1" stop-color="#081725" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="#081725"/>

  <rect x="1060" y="0" width="524" height="396" fill="url(#grid)"/>
  <rect x="1060" y="0" width="524" height="396" fill="url(#grid-fade)"/>

  <circle cx="1420" cy="196" r="320" fill="url(#glow)"/>

  <!-- Parábolas: los tres ángulos del hero de la web -->
  <g fill="none">
    <ellipse cx="1420" cy="196" rx="200" ry="74" transform="rotate(-28 1420 196)" stroke="#edf5fb" stroke-opacity="0.18" stroke-width="1"/>
    <ellipse cx="1420" cy="196" rx="180" ry="108" transform="rotate(45 1420 196)" stroke="#51b8ff" stroke-opacity="0.36" stroke-width="1"/>
    <ellipse cx="1420" cy="196" rx="140" ry="185" transform="rotate(70 1420 196)" stroke="#edf5fb" stroke-opacity="0.18" stroke-width="1"/>
  </g>

  <!-- Rótulos sobre las parábolas -->
  <g font-family="&quot;Avenir Next&quot;, Avenir, &quot;Segoe UI&quot;, sans-serif" font-size="19" font-weight="750" letter-spacing="2" fill="#a3b8c9">
    <text x="1214" y="96">01 <tspan fill="#51b8ff">/</tspan> ARCHITECTURE</text>
    <text x="1560" y="212" text-anchor="end">02 <tspan fill="#51b8ff">/</tspan> DEVSECOPS</text>
    <text x="1214" y="306">03 <tspan fill="#51b8ff">/</tspan> CLOUD SECURITY</text>
  </g>

  <!-- Bloque de texto -->
  <g font-family="&quot;Avenir Next&quot;, Avenir, &quot;Segoe UI&quot;, sans-serif">
    <text x="481" y="152" font-size="100" font-weight="760" letter-spacing="-6" fill="#edf5fb">Lorenzo Lanuza</text>

    <line x1="490" y1="182" x2="544" y2="182" stroke="#51b8ff" stroke-width="1"/>
    <line x1="544" y1="182" x2="1184" y2="182" stroke="#294258" stroke-width="1"/>

    <text x="490" y="220" font-size="31" font-weight="650" letter-spacing="-0.31" fill="#edf5fb">Software Architect <tspan fill="#51b8ff">·</tspan> .NET &amp; Azure</text>
    <text x="490" y="258" font-size="31" font-weight="650" letter-spacing="-0.31" fill="#edf5fb">DevSecOps &amp; Cloud Security</text>

    <text x="490" y="306" font-size="26" font-weight="700" letter-spacing="0.26" fill="#81d4ff">lanuzalorenzo.github.io</text>
    <line x1="490" y1="316" x2="804" y2="316" stroke="#51b8ff" stroke-opacity="0.45" stroke-width="1"/>
  </g>
</svg>
