<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07131e">
    <meta name="description" content="{{description}}">
    <link rel="canonical" href="{{canonical}}">

    <!-- Open Graph / LinkedIn / Facebook / WhatsApp -->
    <meta property="og:type" content="{{og_type}}">
    <meta property="og:locale" content="es_ES">
    <meta property="og:url" content="{{canonical}}">
    <meta property="og:title" content="{{og_title}}">
    <meta property="og:description" content="{{og_description}}">
    <meta property="og:image" content="https://lanuzalorenzo.github.io/assets/social/og-image.jpg?v=20261105b">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Lorenzo Lanuza — Senior Software Engineer &amp; Architect, .NET y Cloud Security">
    <meta property="og:updated_time" content="2026-11-05T00:00:00+01:00">
    <meta name="author" content="Lorenzo Lanuza Arellano">
{{head_extra}}
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{canonical}}">
    <meta name="twitter:title" content="{{og_title}}">
    <meta name="twitter:description" content="{{og_description}}">
    <meta name="twitter:image" content="https://lanuzalorenzo.github.io/assets/social/og-image.jpg?v=20261105b">
    <meta name="twitter:image:alt" content="Lorenzo Lanuza — Senior Software Engineer &amp; Architect, .NET y Cloud Security">

    <title>{{title}}</title>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/marca/favicon-16.png?v=20261105a">
    <link rel="icon" href="favicon.svg?v=20261105a" type="image/svg+xml">
    <link rel="icon" href="favicon.png?v=20261105a" sizes="180x180" type="image/png">
    <link rel="apple-touch-icon" href="assets/marca/apple-touch-icon.png?v=20261105a" sizes="180x180">
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">
    <link rel="stylesheet" href="styles.css?v=20261105b">
    <script src="app.js?v=20261103e" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header">
      <a class="wordmark" href="{{home_href}}" aria-label="Lorenzo Lanuza, inicio"><img src="assets/marca/marca-tile.svg" alt="" width="40" height="40"></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="sr-only">Abrir menú</span>
        <span class="menu-line menu-line-top"></span><span class="menu-line menu-line-bottom"></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Navegación principal">
{{nav}}
      </nav>
    </header>

    <main id="contenido">
{{content}}
    </main>

    <footer class="site-footer">
      <a class="wordmark" href="{{home_href}}" aria-label="Lorenzo Lanuza, inicio"><img src="assets/marca/marca-tile.svg" alt="" width="40" height="40"></a>
      <a href="https://github.com/lanuzalorenzo/lanuzalorenzo.github.io" target="_blank" rel="noreferrer">Código de esta web <span aria-hidden="true">↗</span></a>
      <a href="{{top_href}}">Volver arriba <span aria-hidden="true">↑</span></a>
      <span>© <span id="current-year">2026</span> Lorenzo Lanuza</span>
    </footer>
  </body>
</html>
