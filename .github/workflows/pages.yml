name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verificación (secretos y enlaces)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos
        uses: lanuzalorenzo/core/actions/gitleaks@v1.4

      - name: Comprobar el HTML generado
        run: python3 scripts/build.py --check

      - name: Comprobar enlaces
        uses: lanuzalorenzo/core/actions/check-links@v1.3
        with:
          skip: src

  deploy:
    name: Publicar
    needs: verify
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R index.html portfolio.html api.html ia.html styles.css app.js robots.txt sitemap.xml favicon.svg favicon.png assets .nojekyll _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
